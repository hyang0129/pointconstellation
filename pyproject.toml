[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pointconstellation"
version = "0.1.0"
description = "Geometry-only constellation bottlenecks for point-cloud compression research"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Point Constellation contributors"}]
keywords = ["point-cloud", "compression", "geometry", "autoencoder"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/hyang0129/pointconstellation"
Issues = "https://github.com/hyang0129/pointconstellation/issues"

[project.optional-dependencies]
cluster = [
  "requests>=2.31",
  "websocket-client>=1.7",
]
dev = [
  "h5py>=3.8",
  "pytest>=8",
  "ruff>=0.6",
]
figures = [
  "matplotlib>=3.8",
]
datasets = [
  "h5py>=3.8",
]
train = [
  "torch>=2.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
